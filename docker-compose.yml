services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ride-dispatch

  api:
    build: .
    command: npm run start:api
    ports:
      - "3000:3000"
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ride-dispatch

  worker:
    build: .
    command: npm run start:worker
    environment:
      REDIS_HOST: redis
      WORKER_CONCURRENCY: 10
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ride-dispatch

  billing-consumer:
    build: .
    command: npm run start:billing
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ride-dispatch

  ops-consumer:
    build: .
    command: npm run start:ops
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ride-dispatch

networks:
  ride-dispatch:
    driver: bridge